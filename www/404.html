<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · 툴박스</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
:root{--bg:#F7F7F8;--fg:#18181B;--muted:#62626B;--ink:#18181B;--on:#F4F1EA}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--fg:#EDEDEF;--muted:#A1A1AA;--ink:#F4F1EA;--on:#18181B}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;padding:24px 16px}
main{text-align:center;max-width:420px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--ink);color:var(--on);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.logo svg{width:100%;height:100%}
h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}
a.btn{display:inline-block;background:var(--ink);color:var(--on);text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px}
</style></head>
<body><main>
<div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor" transform="translate(50 50) scale(.76) translate(-50 -58)"><path d="M12 54 V45 L21 33 H79 L88 45 V54 Z"/><rect x="12" y="52" width="76" height="35" rx="7"/><path d="M37 33 V27 a5 5 0 0 1 5 -5 H58 a5 5 0 0 1 5 5 V33" fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round"/><rect x="12" y="54" width="76" height="4" fill="var(--ink)"/><rect x="43.5" y="50" width="13" height="12" rx="2.8" fill="var(--ink)"/><rect x="47" y="55" width="6" height="3.8" rx="1"/></g></svg></div>
<h1>이 주소에는 페이지가 없어요</h1>
<p>주소가 바뀌었거나 잘못 적혔을 수 있어요. 툴박스 홈에서 다시 찾아 주세요.</p>
<a class="btn" href="/">툴박스로 가기</a>
</main></body></html>
